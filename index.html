<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Served Bracket Challenge</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --clay: #C4622D; --clay-light: #E07840; --clay-dark: #8B3A18;
    --sand: #F5E6D3; --sand-dark: #E8D4BC; --chalk: #FBF6F0;
    --green: #2D6B3C;
    --text-dark: #1A0E08; --text-mid: #5C3820; --text-light: #9B7055;
    --white: #FFFCF8; --line: rgba(139,58,24,0.18);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Mono', monospace; background: var(--sand); color: var(--text-dark); min-height: 100vh; }

  header { background: var(--clay); color: var(--chalk); padding: 1.5rem 2rem 1.2rem; border-bottom: 4px solid var(--clay-dark); }
  .header-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  header h1 { font-family: 'Playfair Display', serif; font-size: clamp(1.6rem,4vw,2.4rem); font-weight: 900; line-height: 1; }
  header h1 .tagline { display: block; font-size: 0.52em; font-weight: 400; letter-spacing: 0.15em; opacity: 0.7; font-family: 'DM Mono', monospace; margin-bottom: 0.25rem; }
  .header-meta { font-size: 0.68rem; opacity: 0.65; letter-spacing: 0.06em; line-height: 1.8; text-align: right; }

  main { padding: 1.5rem 2rem; max-width: 900px; margin: 0 auto; }

  .toolbar { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
  #status-text { font-size: 0.68rem; color: var(--text-light); flex: 1; }

  .btn { font-family: 'DM Mono', monospace; font-size: 0.68rem; letter-spacing: 0.06em; padding: 0.4rem 0.9rem; border: none; cursor: pointer; border-radius: 2px; transition: all 0.15s; text-transform: uppercase; }
  .btn-secondary { background: transparent; color: var(--clay); border: 2px solid var(--clay); }
  .btn-secondary:hover { background: var(--clay); color: var(--chalk); }

  .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; display: inline-block; }

  .tabs { display: flex; gap: 0.4rem; padding: 0 2rem; background: var(--clay-dark); }
  .tab { font-family: 'DM Mono', monospace; font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase; background: transparent; border: none; color: var(--chalk); opacity: 0.6; padding: 0.55rem 0.9rem; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.15s; }
  .tab:hover { opacity: 0.85; }
  .tab-active { opacity: 1; border-bottom-color: var(--chalk); }

  .leaderboard { background: var(--white); border: 2px solid var(--line); border-radius: 2px; overflow: hidden; }
  .leaderboard-header { background: var(--clay-dark); color: var(--chalk); padding: 0.6rem 1.2rem; font-size: 0.6rem; letter-spacing: 0.18em; text-transform: uppercase; display: grid; grid-template-columns: 2.5rem 1rem 1fr 1fr 1fr 5rem; align-items: center; gap: 0.5rem; }
  .leaderboard-row { display: grid; grid-template-columns: 2.5rem 1rem 1fr 1fr 1fr 5rem; align-items: center; gap: 0.5rem; padding: 0.85rem 1.2rem; border-bottom: 1px solid var(--line); }
  .leaderboard-row:last-child { border-bottom: none; }
  .leaderboard-row:hover { background: var(--sand); }
  .lb-rank { font-size: 1.1rem; color: var(--text-light); text-align: center; }
  .lb-name { font-size: 0.78rem; font-weight: 500; }
  .lb-score { font-size: 0.75rem; color: var(--text-mid); }
  .lb-score strong { font-size: 0.88rem; color: var(--text-dark); }
  .bracket-link { font-size: 0.62rem; color: var(--clay); text-decoration: none; opacity: 0.7; }
  .bracket-link:hover { opacity: 1; }
  .lb-total { text-align: right; }
  .lb-pts { font-size: 1.05rem; font-weight: 500; color: var(--clay); font-family: 'Playfair Display', serif; }
  .lb-pts-label { font-size: 0.56rem; color: var(--text-light); letter-spacing: 0.08em; }

  #toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: var(--clay-dark); color: var(--chalk); padding: 0.6rem 1.2rem; font-family: 'DM Mono', monospace; font-size: 0.7rem; letter-spacing: 0.08em; border-radius: 2px; z-index: 9999; opacity: 0; transition: opacity 0.3s; pointer-events: none; }

  @media (max-width: 600px) {
    main { padding: 1rem; }
    header { padding: 1rem; }
    .leaderboard-header { display: none; }
    .leaderboard-row { grid-template-columns: 2rem 0.8rem 1fr auto; grid-template-rows: auto auto; }
    .lb-score { grid-column: 3 / 5; font-size: 0.65rem; }
    .lb-total { grid-column: 4; grid-row: 1; }
  }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <h1><span class="tagline">Served Bracket Challenge</span><span id="tournament-title"></span></h1>
    <div class="header-meta" id="tournament-meta"></div>
  </div>
</header>

<nav class="tabs" id="tournament-tabs"></nav>

<main>
  <div class="toolbar">
    <div id="status-text">Press Refresh to load standings.</div>
    <button class="btn btn-secondary" onclick="refreshStandings()">↺ Refresh Standings</button>
  </div>

  <div class="leaderboard">
    <div class="leaderboard-header">
      <span>Rank</span>
      <span></span>
      <span>Player</span>
      <span>Men's ATP</span>
      <span>Women's WTA</span>
      <span style="text-align:right">Total</span>
    </div>
    <div id="leaderboard-body"></div>
  </div>
</main>

<div id="toast"></div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
